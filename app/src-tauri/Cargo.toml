[package]
name = "wrtier_app"
version = "0.1.6"
description = "Desktop and Android app for wrtier"
authors = ["R.L. Fiehn"]
edition = "2024"
license = "Apache-2.0"
publish = false  # also keeps it off the app's Licenses page (about.toml)

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wrtier_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"  # the folder picker for choosing a Vault
tauri-plugin-fs = "2"  # reading a picture the Android picker gives as a content address (ADR 0021)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"          # a new Device ID
similar = "2"              # the smallest patch for the editor when the text changes underneath it
wrtier = { path = "../.." }  # the History engine
# Typesetting (Phase 3), the version tested in Phase 0b. Dependencies are built optimised even
# in dev builds (root Cargo.toml), or Typst is 10–50x slower.
# Their version is pinned once, in the workspace root Cargo.toml.
typst.workspace = true
typst-layout.workspace = true
typst-svg.workspace = true   # the Page preview's pages
typst-pdf.workspace = true   # PDF Exports
typst-docx = { path = "../../typst-docx" }  # .docx Exports (ADR 0016)
typst-ide.workspace = true   # click-to-jump from the pages to the text
typst-kit = { workspace = true, features = ["embedded-fonts", "scan-fonts"] }  # Vault, bundled and Device fonts
comemo = "0.5"           # Typst's cache, evicted after every compile
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }  # Syncthing's REST API, on this Device only
roxmltree = "0.21"  # reading Syncthing's settings file; tests also check a .docx's XML (already built for Typst)
tauri-plugin-opener = "2"  # "What's new": a release's page in the browser
# App updates (ADR 0014)
semver = "1"            # which App version is newer
minisign-verify = "0.3" # a download is signed with the update signing key
base64 = "0.22"         # the key and signatures are base64, as `tauri signer` writes them
# The Spellchecker (ADR 0019)
spellbook = "0.4"       # reads Hunspell Dictionaries: which words they know, and suggestions
sha2 = "0.10"           # a downloaded Dictionary is checked against the app's list
# The Grammar checker (ADR 0023). Pinned exactly: its rule names are what Dismissed Marks and the
# per-Work rule switches are kept under. Used patched (the workspace's Cargo.toml). No thesaurus
# (4.5 MB of binary nothing uses); "concurrent" so its rules can be kept behind a Mutex.
harper-core = { version = "=3.2.0", default-features = false, features = ["concurrent"] }
tokio = { version = "1", default-features = false, features = ["sync"] }  # Harper's thread answers through a oneshot (already in the build, through Tauri)

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"    # the portable exe puts a new version in its own place

[dev-dependencies]
tempfile = "3"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }  # tests read a .docx back
rusqlite = { version = "0.41.1", features = ["bundled"] }  # tests write files as another program would

# Build profiles live in the workspace root Cargo.toml.
