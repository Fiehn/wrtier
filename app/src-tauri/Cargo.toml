[package]
name = "wrtier_app"
version = "0.1.0"
description = "Desktop and Android app for Wrtier"
authors = ["R.L. Fiehn"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wrtier_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"  # the folder picker for choosing a Vault
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"          # a new Device ID
similar = "2"              # the smallest patch for the editor when the text changes underneath it
wrtier = { path = "../.." }  # the History engine
# Typesetting (Phase 3), the version tested in Phase 0b. Dependencies are built optimised even
# in dev builds (root Cargo.toml), or Typst is 10–50x slower.
typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"     # the Page preview's pages
typst-pdf = "0.15.1"     # PDF Exports
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }  # a .docx is a zip of XML files
typst-ide = "0.15.1"     # click-to-jump from the pages to the text
typst-kit = { version = "0.15.1", default-features = false, features = ["embedded-fonts", "scan-fonts"] }  # Vault, bundled and Device fonts
comemo = "0.5"           # Typst's cache, evicted after every compile
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }  # Syncthing's REST API, on this Device only
roxmltree = "0.21"  # reading Syncthing's settings file; tests also check a .docx's XML (already built for Typst)

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.41.1", features = ["bundled"] }  # tests write files as another program would

# Build profiles live in the workspace root Cargo.toml.
