[package]
name = "spike_harper"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
harper-core = { version = "=3.2.0", default-features = false, features = ["concurrent"] }
spellbook = "=0.4.2"   # the one the app uses, to compare against

[features]
default = ["count-memory", "thesaurus"]
count-memory = []
thesaurus = ["harper-core/thesaurus"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# harper-core as the app builds it: the repository's patches/harper-core+3.2.0.patch applied by
# `cargo patch-crate` run in the repository's root, which writes it to the root's target/patch/
# (ADR 0023). Run that before building. Comment this out to measure the published crate.
[patch.crates-io]
harper-core = { path = "../../target/patch/harper-core-3.2.0" }
