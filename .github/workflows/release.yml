# Builds the app and attaches it to a draft GitHub release when a version tag is pushed. The
# easy way: `npm run release -- 0.1.4` in app/ (app/scripts/release.mjs) sets the version in
# every file, commits, tags and pushes. By hand, once the version is set everywhere:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The tag must match the version in app/src-tauri/tauri.conf.json. A tag with a suffix
# (v0.1.0-rc1) makes a pre-release. Check the draft on GitHub's Releases page, then publish it.
#
# The Android APK is signed with the release key from two repository secrets:
#   ANDROID_KEY_BASE64    the .jks file, base64-encoded
#   ANDROID_KEY_PASSWORD  its password
#
# Every build is also signed with the update signing key (ADR 0014), for the app's "Check for
# updates", from two more:
#   TAURI_SIGNING_PRIVATE_KEY           the key file's contents (wrtier-update.key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The last job writes latest.json, which lists each platform's file and signature. GitHub serves
# it only from the newest published release that isn't a pre-release, so publishing the draft is
# what makes an update available.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  # One draft release first, so the builds below don't each try to create it.
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app's version
        id: check
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != "v$version" && "$tag" != "v$version-"* ]]; then
            echo "::error::The tag $tag doesn't match the version $version in tauri.conf.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag moved to a newer commit (to fix a failed build) uses the draft it already has; the
      # builds replace its files.
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "id=$(gh release view "$tag" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pre=""; [[ "$tag" == *-* ]] && pre="--prerelease"
          gh release create "$tag" --draft --verify-tag $pre --title "Wrtier $tag" \
            --notes "Download the file for your system below: the portable .exe for Windows (no installing: just run it), the .deb for Debian and Ubuntu, and the .apk for Android when there is one."
          echo "id=$(gh release view "$tag" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One portable .exe: the program itself, no installer.
          - platform: windows-latest
            args: "--no-bundle"
          # The oldest supported Ubuntu, so the .deb runs on Debian 12 and newer too.
          - platform: ubuntu-22.04
            args: "--bundles deb"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux libraries Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Writes the app's Licenses page (app/scripts/licenses.mjs).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Install the editor's packages
        run: npm ci
        working-directory: app

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}
        working-directory: app

      - name: Sign it and upload it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # The app's program is named after its crate (wrtier.exe beside it is the engine's own).
            file="$RUNNER_TEMP/wrtier_${VERSION}_windows-x64-portable.exe"
            cp target/release/wrtier_app.exe "$file"
          else
            deb=$(ls target/release/bundle/deb/*.deb | head -1)
            file="$RUNNER_TEMP/$(basename "$deb")"
            cp "$deb" "$file"
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets aren't set."
            exit 1
          fi
          # Writes $file.sig. The version goes into the signature, which the app checks.
          (cd app && npx tauri signer sign --app-version "$VERSION" "$file")
          gh release upload "$GITHUB_REF_NAME" "$file" "$file.sig" --clobber

  # Off until the app can open a Vault on Android (v1 plan, Phase 6). Turn it on with the
  # repository variable ANDROID_RELEASE = true (Settings → Secrets and variables → Actions → Variables).
  android:
    needs: release
    if: vars.ANDROID_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Its default packages include "tools", which Google's SDK list no longer has. Gradle
      # fetches the platform and build tools it needs by itself.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;28.2.13676358

      - name: Point Tauri to the NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Install the editor's packages
        run: npm ci
        working-directory: app

      - name: Write the signing key
        env:
          KEY: ${{ secrets.ANDROID_KEY_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEY" || -z "$PASSWORD" ]]; then
            echo "::error::The ANDROID_KEY_BASE64 and ANDROID_KEY_PASSWORD secrets aren't set."
            exit 1
          fi
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/wrtier-release.jks"
          printf 'keyAlias=wrtier\npassword=%s\nstoreFile=%s\n' "$PASSWORD" "$RUNNER_TEMP/wrtier-release.jks" \
            > app/src-tauri/gen/android/keystore.properties

      # 64-bit ARM only: nearly every Android phone from the last several years.
      - name: Build the APK
        run: npm run tauri android build -- --apk --target aarch64
        working-directory: app

      - name: Sign it and upload it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          apk=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" | head -1)
          file="$RUNNER_TEMP/wrtier_${VERSION}_android-arm64.apk"
          cp "$apk" "$file"
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets aren't set."
            exit 1
          fi
          (cd app && npx tauri signer sign --app-version "$VERSION" "$file")
          gh release upload "$GITHUB_REF_NAME" "$file" "$file.sig" --clobber

  # latest.json for "Check for updates" (app/src-tauri/src/update.rs): each platform's file and
  # signature, from the .sig files the builds uploaded. Android's is left out when it isn't built.
  manifest:
    needs: [release, desktop, android]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write latest.json and upload it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          mkdir sigs
          gh release download "$tag" --repo "$REPO" --pattern "*.sig" --dir sigs
          base="https://github.com/$REPO/releases/download/$tag"
          # One platform's entry: its key in latest.json, and the end of its file's name.
          entry() {
            local sig
            sig=$(ls sigs/*"$2".sig 2>/dev/null | head -1)
            [[ -n "$sig" ]] || return 0
            local file
            file=$(basename "${sig%.sig}")
            jq -n --arg key "$1" --arg url "$base/$file" --arg signature "$(cat "$sig")" '{($key): {url: $url, signature: $signature}}'
          }
          {
            entry windows-x86_64 _windows-x64-portable.exe
            entry linux-x86_64 _amd64.deb
            entry android-aarch64 _android-arm64.apk
          } | jq -s --arg version "$VERSION" '{version: $version, pub_date: (now | todate), platforms: add}' > latest.json
          cat latest.json
          gh release upload "$tag" latest.json --repo "$REPO" --clobber
