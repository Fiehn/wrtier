# cargo-about: which licenses the crates the app ships with may have. Read by
# app/scripts/licenses.mjs, which writes the Licenses page (Settings → Licenses…).
# A new dependency under a license not listed here stops the build until it's checked and added.

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Every platform the app is built for, so one page covers them all.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

# Crates whose license files cargo-about can't read on its own.
workarounds = ["ring", "rustls"]

# Dev and build tools aren't shipped.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The app's own crates.
private = { ignore = true }
